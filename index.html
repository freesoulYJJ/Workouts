<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>My Workouts</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #fff; --text: #1f2330; --muted: #6b7280;
    --accent: #4f46e5; --accent-soft: #eef2ff; --danger: #dc2626; --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { background: var(--accent); color: #fff; padding: calc(20px + env(safe-area-inset-top)) 16px 0; }
  header h1 { margin: 0 0 14px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 34px; height: 34px; border-radius: 9px; }
  nav { display: flex; gap: 4px; }
  nav button {
    flex: 1; background: transparent; border: none; color: #c7d2fe; font-size: 15px;
    padding: 10px 0 12px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600;
  }
  nav button.active { color: #fff; border-bottom-color: #fff; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .hidden { display: none !important; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid var(--border);
    border-radius: 10px; background: #fff; color: var(--text); font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  /* Exercise group picker (2 × 2) */
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--accent-soft);
           border-radius: 12px; padding: 5px; margin-top: 4px; }
  .kinds button {
    border: none; background: transparent; padding: 10px 6px; border-radius: 9px;
    font-size: 15px; cursor: pointer; color: var(--accent); font-weight: 600;
  }
  .kinds button.on { background: var(--accent); color: #fff; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button {
    border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .chips button:active { background: var(--accent-soft); }

  .primary {
    width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 12px; cursor: pointer;
  }
  .primary:active { transform: scale(.99); }
  .secondary {
    display: block; width: 100%; margin-top: 8px; padding: 11px; font-size: 15px; font-weight: 600; text-align: center;
    background: var(--accent-soft); color: var(--accent); border: none; border-radius: 10px; cursor: pointer;
  }

  /* Set-by-set rows */
  .set-head, .set-row { display: grid; grid-template-columns: 44px 1fr 1fr 32px; gap: 8px; align-items: center; }
  .set-head { font-size: 13px; color: var(--muted); font-weight: 600; margin: 12px 0 4px; }
  .set-row { margin-bottom: 8px; }
  .set-num { font-weight: 700; color: var(--accent); text-align: center; }
  .set-row input { padding: 10px; text-align: center; }

  /* Photos */
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--accent-soft); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .thumb .x {
    position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.6); color: #fff; font-size: 12px; cursor: pointer; line-height: 22px; padding: 0;
  }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center;
            justify-content: center; z-index: 10; padding: 20px; }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; z-index: 20;
  }
  .toast.show { opacity: 1; }
  .day-title { font-weight: 700; margin: 0 0 8px; }
  .entry { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
           border-top: 1px solid var(--border); }
  .entry:first-of-type { border-top: none; }
  .entry .icon { font-size: 22px; line-height: 1; }
  .entry .info { flex: 1; min-width: 0; }
  .entry .name { font-weight: 600; }
  .entry .detail { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .entry .notes { font-size: 14px; margin-top: 4px; font-style: italic; color: #4b5563; }
  .entry .thumb { width: 64px; height: 64px; }
  .del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; }
  .del:hover { color: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px 8px; text-align: center;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat .num { font-size: 26px; font-weight: 800; color: var(--accent); }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pb { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--border); }
  .pb:first-of-type { border-top: none; }
  .pb .val { font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .week { display: flex; justify-content: space-between; }
  .week .d { text-align: center; font-size: 12px; color: var(--muted); }
  .week .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft);
               margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; }
  .week .dot.done { background: var(--accent); color: #fff; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 14px; cursor: pointer; padding: 0; }

  /* Chart */
  .chart-wrap { position: relative; margin-top: 12px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .tip {
    position: absolute; pointer-events: none; background: #111827; color: #fff; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -115%);
  }
  .tip b { display: block; font-size: 15px; }
</style>
</head>
<body>

<header>
  <h1><img src="icon-180.png" alt="">My Workouts</h1>
  <nav>
    <button data-tab="log" class="active">Log</button>
    <button data-tab="history">History</button>
    <button data-tab="progress">Progress</button>
  </nav>
</header>

<main>
  <!-- LOG TAB -->
  <section id="tab-log">
    <div class="card">
      <label>What did you do?</label>
      <div class="kinds" id="kindPicker"></div>

      <label for="date">Date</label>
      <input type="date" id="date">

      <label for="exercise">Activity</label>
      <input id="exercise" list="exerciseList" placeholder="Type or tap one below">
      <datalist id="exerciseList"></datalist>
      <div class="chips" id="chips"></div>

      <div id="strengthFields">
        <div class="set-head"><span style="text-align:center">Set</span><span>Reps</span><span>Weight (<span class="unitLbl">kg</span>)</span><span></span></div>
        <div id="setRows"></div>
        <button class="secondary" id="addSetBtn">+ Add set</button>
      </div>

      <div id="timeFields" class="hidden">
        <div class="row">
          <div><label for="minutes">Minutes</label><input id="minutes" type="number" inputmode="numeric" min="0" placeholder="30"></div>
          <div id="distanceBox"><label for="distance">Distance (km)</label><input id="distance" type="number" inputmode="decimal" min="0" step="0.1" placeholder="5"></div>
        </div>
      </div>

      <label for="notes">Notes &amp; photos (optional)</label>
      <textarea id="notes" placeholder="How did it feel?"></textarea>
      <div class="thumbs" id="pendingThumbs"></div>
      <label class="secondary" for="photoInput" style="margin-top:8px; color:var(--accent)">📷 Add photos</label>
      <input type="file" id="photoInput" accept="image/*" multiple class="hidden">

      <button class="primary" id="saveBtn">Save</button>
    </div>

    <div class="card">
      <h2>Today</h2>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- HISTORY TAB -->
  <section id="tab-history" class="hidden">
    <div id="historyList"></div>
  </section>

  <!-- PROGRESS TAB -->
  <section id="tab-progress" class="hidden">
    <div class="stats">
      <div class="stat"><div class="num" id="statWeek">0</div><div class="lbl">days this week</div></div>
      <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">day streak</div></div>
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">total workouts</div></div>
    </div>

    <div class="card">
      <h2>📈 Progress over time</h2>
      <div id="chartArea">
        <select id="chartExercise"></select>
        <div class="chart-sub" id="chartSub"></div>
        <div class="chart-wrap" id="chartWrap"></div>
      </div>
      <div class="empty hidden" id="chartEmpty">Log an activity with a weight, distance or minutes and your chart will appear here.</div>
    </div>

    <div class="card">
      <h2>Last 7 days</h2>
      <div class="week" id="weekDots"></div>
    </div>
    <div class="card">
      <h2>🏆 Personal bests</h2>
      <div id="pbList"></div>
    </div>
    <div class="card">
      <h2>Settings</h2>
      <label for="unit">Weight unit</label>
      <select id="unit"><option value="kg">Kilograms (kg)</option><option value="lb">Pounds (lb)</option></select>
      <p style="margin:14px 0 0"><button class="link-btn" id="exportBtn">⬇️ Download a backup of my data (with photos)</button></p>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  // ---------- Exercise groups ----------
  // fields: "sets" = reps & weight per set, "time" = minutes, "timeDist" = minutes & distance
  const KINDS = {
    strength: { label: "Strength",     icon: "🏋️", fields: "sets",
                ideas: ["Squats", "Bench press", "Deadlift", "Push-ups", "Lunges", "Shoulder press"] },
    cardio:   { label: "Cardio",       icon: "🏃", fields: "timeDist",
                ideas: ["Running", "Walking", "Rowing", "Swimming", "Elliptical", "Jump rope"] },
    flex:     { label: "Mind & Body",  icon: "🧘", fields: "time",
                ideas: ["Yoga", "Stretching", "Pilates", "Meditation", "Foam rolling"] },
    sport:    { label: "Sports & Fun", icon: "🎾", fields: "timeDist",
                ideas: ["Hiking", "Ultimate frisbee", "Tennis", "Biking", "Climbing", "Basketball"] },
  };
  // A matching emoji for common activities (falls back to the group's emoji)
  const ACTIVITY_ICONS = {
    hik: "🥾", frisbee: "🥏", tennis: "🎾", bik: "🚴", cycl: "🚴", climb: "🧗", basketball: "🏀",
    soccer: "⚽", football: "⚽", volleyball: "🏐", badminton: "🏸", ski: "⛷️", snowboard: "🏂",
    surf: "🏄", swim: "🏊", golf: "⛳", danc: "💃", skat: "⛸️", yoga: "🧘", meditat: "🧘",
    stretch: "🤸", pilates: "🤸", walk: "🚶", run: "🏃", row: "🚣", box: "🥊",
  };
  const iconFor = e => {
    const name = e.exercise.toLowerCase();
    const key = Object.keys(ACTIVITY_ICONS).find(k => name.includes(k));
    return key && e.kind !== "strength" ? ACTIVITY_ICONS[key] : (KINDS[e.kind] || KINDS.cardio).icon;
  };

  // ---------- Saved data (kept in this browser) ----------
  const STORE = "workout-tracker-v1";
  let data = JSON.parse(localStorage.getItem(STORE) || '{"entries":[],"unit":"kg"}');
  const save = () => localStorage.setItem(STORE, JSON.stringify(data));

  // Older entries stored one sets/reps/weight; turn them into a per-set list
  data.entries.forEach(e => {
    if (e.kind === "strength" && !e.setList) {
      const n = e.sets || 1;
      e.setList = Array.from({ length: n }, () => ({ reps: e.reps, weight: e.weight }));
    }
  });

  // ---------- Photo storage (photos are too big for the normal storage, so they live in IndexedDB) ----------
  const photoDb = new Promise((resolve, reject) => {
    const req = indexedDB.open("workout-photos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("photos");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const photoTx = async (mode, fn) => {
    const db = await photoDb;
    return new Promise((resolve, reject) => {
      const tx = db.transaction("photos", mode), req = fn(tx.objectStore("photos"));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => reject(tx.error);
    });
  };
  const putPhoto = (id, blob) => photoTx("readwrite", s => s.put(blob, id));
  const getPhoto = id => photoTx("readonly", s => s.get(id));
  const deletePhoto = id => photoTx("readwrite", s => s.delete(id));
  // Ask the phone not to clear our storage when it's low on space
  navigator.storage?.persist?.();

  // Shrink photos so hundreds fit on the phone
  function shrinkPhoto(file, maxSide = 1280) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Could not read photo")), "image/jpeg", 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read photo")); };
      img.src = url;
    });
  }

  const photoUrls = {};
  async function photoUrl(id) {
    if (!photoUrls[id]) {
      const blob = await getPhoto(id);
      if (!blob) return null;
      photoUrls[id] = URL.createObjectURL(blob);
    }
    return photoUrls[id];
  }

  function openViewer(src) {
    const v = document.createElement("div");
    v.className = "viewer";
    v.innerHTML = `<img src="${src}" alt="">`;
    v.onclick = () => v.remove();
    document.body.appendChild(v);
  }

  let kind = "strength";
  let pendingPhotos = [];   // photos picked but not saved yet: { blob, url }
  const $ = id => document.getElementById(id);

  // ---------- Date helpers ----------
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const todayStr = () => fmt(new Date());
  const shiftDay = (str, n) => { const d = new Date(str + "T12:00:00"); d.setDate(d.getDate() + n); return fmt(d); };
  const prettyDate = str => {
    if (str === todayStr()) return "Today";
    if (str === shiftDay(todayStr(), -1)) return "Yesterday";
    return new Date(str + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  };
  const shortDate = str => new Date(str + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // Show weights in the unit chosen in Settings, whatever unit they were logged in
  const toUnit = (w, from) => {
    from = from || "kg";
    if (from === data.unit) return w;
    const v = data.unit === "lb" ? w * 2.20462 : w / 2.20462;
    return Math.round(v * 10) / 10;
  };

  // ---------- Tabs ----------
  document.querySelectorAll("nav button").forEach(btn => btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b === btn));
    ["log","history","progress"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab));
    render();
  });

  // ---------- Group picker ----------
  $("kindPicker").innerHTML = Object.entries(KINDS)
    .map(([k, v]) => `<button data-kind="${k}">${v.icon} ${v.label}</button>`).join("");
  document.querySelectorAll("#kindPicker button").forEach(btn => btn.onclick = () => setKind(btn.dataset.kind));

  function setKind(k) {
    kind = k;
    const fields = KINDS[k].fields;
    document.querySelectorAll("#kindPicker button").forEach(b => b.classList.toggle("on", b.dataset.kind === k));
    $("strengthFields").classList.toggle("hidden", fields !== "sets");
    $("timeFields").classList.toggle("hidden", fields === "sets");
    $("distanceBox").classList.toggle("hidden", fields !== "timeDist");
    renderChips();
  }

  // Quick-pick buttons: things you've logged in this group first, then ideas
  function renderChips() {
    const used = [...new Set([...data.entries].reverse().filter(e => e.kind === kind).map(e => e.exercise))];
    const seen = new Set(used.map(n => n.toLowerCase()));
    const names = [...used, ...KINDS[kind].ideas.filter(n => !seen.has(n.toLowerCase()))].slice(0, 8);
    $("chips").innerHTML = names.map(n => `<button type="button">${escapeHtml(n)}</button>`).join("");
    $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { $("exercise").value = b.textContent; });
  }

  // ---------- Set rows ----------
  function addSetRow(reps = "", weight = "") {
    const row = document.createElement("div");
    row.className = "set-row";
    row.innerHTML = `
      <span class="set-num"></span>
      <input type="number" inputmode="numeric" min="0" placeholder="10" class="reps" value="${reps}">
      <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="20" class="weight" value="${weight}">
      <button class="del" title="Remove set">✕</button>`;
    row.querySelector(".del").onclick = () => {
      row.remove();
      if (!$("setRows").children.length) addSetRow();
      numberSets();
    };
    $("setRows").appendChild(row);
    numberSets();
    return row;
  }
  const numberSets = () => [...$("setRows").children].forEach((r, i) => r.querySelector(".set-num").textContent = i + 1);

  // "+ Add set" copies the previous set so you only change what's different
  $("addSetBtn").onclick = () => {
    const last = $("setRows").lastElementChild;
    const row = addSetRow(last ? last.querySelector(".reps").value : "", last ? last.querySelector(".weight").value : "");
    row.querySelector(".reps").focus();
  };

  function resetSets() { $("setRows").innerHTML = ""; addSetRow(); }

  // ---------- Picking photos ----------
  $("photoInput").onchange = async () => {
    const files = [...$("photoInput").files];
    $("photoInput").value = "";
    for (const f of files) {
      try {
        const blob = await shrinkPhoto(f);
        pendingPhotos.push({ blob, url: URL.createObjectURL(blob) });
      } catch { toast("Couldn't read one of the photos"); }
    }
    renderPendingPhotos();
  };

  function renderPendingPhotos() {
    $("pendingThumbs").innerHTML = pendingPhotos.map((p, i) =>
      `<div class="thumb"><img src="${p.url}" alt=""><button class="x" data-i="${i}" title="Remove">✕</button></div>`).join("");
    $("pendingThumbs").querySelectorAll(".x").forEach(b => b.onclick = () => {
      URL.revokeObjectURL(pendingPhotos[b.dataset.i].url);
      pendingPhotos.splice(b.dataset.i, 1);
      renderPendingPhotos();
    });
    $("pendingThumbs").querySelectorAll("img").forEach(img => img.onclick = () => openViewer(img.src));
  }

  // ---------- Save an entry ----------
  $("saveBtn").onclick = async () => {
    const exercise = $("exercise").value.trim();
    if (!exercise) { toast("Please type or pick an activity"); $("exercise").focus(); return; }
    const num = v => v === "" ? null : Number(v);
    const entry = { id: Date.now(), date: $("date").value || todayStr(), kind, exercise, notes: $("notes").value.trim() };

    if (KINDS[kind].fields === "sets") {
      entry.unit = data.unit;
      entry.setList = [...$("setRows").children]
        .map(r => ({ reps: num(r.querySelector(".reps").value), weight: num(r.querySelector(".weight").value) }))
        .filter(s => s.reps != null || s.weight != null);
      if (!entry.setList.length) { toast("Fill in reps or weight for at least one set"); return; }
    } else {
      entry.minutes = num($("minutes").value);
      entry.distance = KINDS[kind].fields === "timeDist" ? num($("distance").value) : null;
    }

    if (pendingPhotos.length) {
      try {
        entry.photos = [];
        for (const [i, p] of pendingPhotos.entries()) {
          const id = `${entry.id}-${i}`;
          await putPhoto(id, p.blob);
          photoUrls[id] = p.url;
          entry.photos.push(id);
        }
      } catch {
        toast("Your phone is out of space for photos");
        return;
      }
    }

    data.entries.push(entry);
    save();
    ["exercise","minutes","distance","notes"].forEach(id => $(id).value = "");
    pendingPhotos = [];
    renderPendingPhotos();
    resetSets();
    toast("Saved! Nice work 🎉");
    render();
  };

  const removeEntry = async id => {
    if (!confirm("Delete this entry?")) return;
    const e = data.entries.find(e => e.id === id);
    data.entries = data.entries.filter(e => e.id !== id);
    save(); render();
    for (const p of e?.photos || []) await deletePhoto(p);
  };

  // ---------- Display ----------
  const heaviest = e => {
    const ws = (e.setList || []).map(s => s.weight).filter(w => w != null);
    return ws.length ? toUnit(Math.max(...ws), e.unit) : null;
  };

  const describe = e => {
    if (e.kind !== "strength") {
      const parts = [];
      if (e.minutes != null) parts.push(`${e.minutes} min`);
      if (e.distance != null) parts.push(`${e.distance} km`);
      return parts.join(" · ") || KINDS[e.kind]?.label || "";
    }
    // Group identical sets in a row: "3 × 10 @ 40 kg, 1 × 8 @ 45 kg"
    const groups = [];
    (e.setList || []).forEach(s => {
      const g = groups[groups.length - 1];
      if (g && g.reps === s.reps && g.weight === s.weight) g.n++;
      else groups.push({ ...s, n: 1 });
    });
    return groups.map(g => {
      const reps = g.reps != null ? `${g.n} × ${g.reps}` : `${g.n} set${g.n > 1 ? "s" : ""}`;
      return g.weight != null ? `${reps} @ ${toUnit(g.weight, e.unit)} ${data.unit}` : reps;
    }).join(", ") || "—";
  };

  const entryHtml = e => `
    <div class="entry">
      <div class="icon">${iconFor(e)}</div>
      <div class="info">
        <div class="name">${escapeHtml(e.exercise)}</div>
        <div class="detail">${describe(e)}</div>
        ${e.notes ? `<div class="notes">“${escapeHtml(e.notes)}”</div>` : ""}
        ${e.photos?.length ? `<div class="thumbs">${e.photos.map(p => `<div class="thumb"><img data-photo="${p}" alt=""></div>`).join("")}</div>` : ""}
      </div>
      <button class="del" title="Delete" onclick="removeEntry(${e.id})">✕</button>
    </div>`;

  // Photos load from storage after the list is drawn
  function fillPhotos() {
    document.querySelectorAll("img[data-photo]:not([src])").forEach(async img => {
      const url = await photoUrl(img.dataset.photo);
      if (url) { img.src = url; img.onclick = () => openViewer(url); }
    });
  }

  // ---------- Chart ----------
  // For each activity: one point per day, using the heaviest set (strength) or distance/minutes (others)
  function chartSeries() {
    const series = {};
    data.entries.forEach(e => {
      const key = e.exercise.toLowerCase();
      let v = null, unit = "";
      if (e.kind === "strength") { v = heaviest(e); unit = data.unit; }
      else if (e.distance != null) { v = e.distance; unit = "km"; }
      else if (e.minutes != null) { v = e.minutes; unit = "min"; }
      if (v == null) return;
      const s = series[key] ||= { name: e.exercise, unit, kind: e.kind, byDay: {} };
      if (s.unit !== unit) return; // don't mix km and minutes on one line
      s.byDay[e.date] = Math.max(s.byDay[e.date] ?? -Infinity, v);
    });
    return series;
  }

  function niceStep(range) {
    const raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    return [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  }

  function drawChart() {
    const series = chartSeries();
    const keys = Object.keys(series).sort((a, b) => series[a].name.localeCompare(series[b].name));
    $("chartArea").classList.toggle("hidden", !keys.length);
    $("chartEmpty").classList.toggle("hidden", !!keys.length);
    if (!keys.length) return;

    const sel = $("chartExercise");
    const prev = sel.value;
    sel.innerHTML = keys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(series[k].name)}</option>`).join("");
    sel.value = keys.includes(prev) ? prev : keys[0];

    const s = series[sel.value];
    const pts = Object.entries(s.byDay).sort(([a], [b]) => a.localeCompare(b)).map(([date, v]) => ({ date, v }));
    const what = s.kind === "strength" ? "Heaviest set each day" : (s.unit === "km" ? "Distance each day" : "Minutes each day");
    const change = pts.length > 1 ? Math.round((pts[pts.length-1].v - pts[0].v) * 10) / 10 : 0;
    $("chartSub").innerHTML = `${what} (${s.unit})` +
      (pts.length > 1 ? ` · <b style="color:var(--text)">${change > 0 ? "+" : ""}${change} ${s.unit}</b> since you started` : "");

    // Layout
    const W = 340, H = 210, L = 34, R = 12, T = 30, B = 26;
    const vals = pts.map(p => p.v);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (lo === hi) { lo = Math.max(0, lo - 5); hi = hi + 5; }
    const step = niceStep(hi - lo);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;

    // Space points by real dates so gaps between workouts show
    const t0 = new Date(pts[0].date + "T12:00:00").getTime();
    const t1 = new Date(pts[pts.length-1].date + "T12:00:00").getTime();
    const x = d => pts.length === 1 ? (L + W - R) / 2 : L + ((new Date(d + "T12:00:00").getTime() - t0) / (t1 - t0)) * (W - L - R);
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

    let grid = "";
    for (let g = lo; g <= hi + 1e-9; g += step) {
      grid += `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#eef0f3" stroke-width="1"/>
               <text x="${L-8}" y="${y(g)+4}" text-anchor="end" font-size="12" fill="#6b7280">${Math.round(g*10)/10}</text>`;
    }
    const xLabels = (pts.length === 1 ? [pts[0]] : [pts[0], pts[pts.length-1]])
      .map((p, i, arr) => `<text x="${x(p.date)}" y="${H-6}" font-size="12" fill="#6b7280"
        text-anchor="${arr.length === 1 ? "middle" : (i === 0 ? "start" : "end")}">${shortDate(p.date)}</text>`).join("");
    const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p.date)},${y(p.v)}`).join(" ");
    const dots = pts.map((p, i) => `
      <circle cx="${x(p.date)}" cy="${y(p.v)}" r="5" fill="#4f46e5" stroke="#fff" stroke-width="2"/>
      <circle cx="${x(p.date)}" cy="${y(p.v)}" r="16" fill="transparent" data-i="${i}" style="cursor:pointer"/>`).join("");
    const last = pts[pts.length - 1];

    $("chartWrap").innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(s.name)} progress chart">
        ${grid}
        <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#d1d5db" stroke-width="1"/>
        ${xLabels}
        <path d="${path}" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <line id="crosshair" y1="${T}" y2="${H-B}" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
        ${dots}
        <text id="lastLabel" x="${Math.min(x(last.date) + 4, W)}" y="${y(last.v) - 12}" text-anchor="${pts.length === 1 ? "middle" : "end"}"
              font-size="13" font-weight="700" fill="#1f2330">${last.v} ${s.unit}</text>
      </svg>
      <div class="tip hidden" id="chartTip"></div>`;

    // Hover / tap a point to see its exact value
    const svg = $("chartWrap").querySelector("svg"), tip = $("chartTip"), cross = $("crosshair");
    svg.querySelectorAll("circle[data-i]").forEach(c => {
      const show = () => {
        const p = pts[c.dataset.i];
        const scale = svg.getBoundingClientRect().width / W;
        tip.innerHTML = `<b>${p.v} ${s.unit}</b>${shortDate(p.date)}`;
        tip.style.left = x(p.date) * scale + "px";
        tip.style.top = y(p.v) * scale + "px";
        tip.classList.remove("hidden");
        cross.setAttribute("x1", x(p.date)); cross.setAttribute("x2", x(p.date));
        cross.setAttribute("visibility", "visible");
        $("lastLabel").setAttribute("visibility", "hidden");
      };
      c.addEventListener("mouseenter", show);
      c.addEventListener("click", show);
      c.addEventListener("mouseleave", () => { tip.classList.add("hidden"); cross.setAttribute("visibility", "hidden"); $("lastLabel").setAttribute("visibility", "visible"); });
    });
  }
  $("chartExercise").onchange = drawChart;

  function render() {
    const entries = [...data.entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    // Activity suggestions from what you've logged before
    $("exerciseList").innerHTML = [...new Set(entries.map(e => e.exercise))]
      .map(n => `<option value="${escapeHtml(n)}">`).join("");
    renderChips();

    // Today
    const today = entries.filter(e => e.date === todayStr());
    $("todayList").innerHTML = today.length ? today.map(entryHtml).join("")
      : `<div class="empty">Nothing logged yet today.<br>You've got this! 💪</div>`;

    // History grouped by day
    const byDay = {};
    entries.forEach(e => (byDay[e.date] ||= []).push(e));
    const days = Object.keys(byDay);
    $("historyList").innerHTML = days.length
      ? days.map(d => `<div class="card"><p class="day-title">${prettyDate(d)}</p>${byDay[d].map(entryHtml).join("")}</div>`).join("")
      : `<div class="card empty">No workouts yet. Log your first one on the <b>Log</b> tab!</div>`;
    fillPhotos();

    // Stats
    const daySet = new Set(days);
    const t = todayStr();
    let streak = 0, cur = daySet.has(t) ? t : shiftDay(t, -1);
    while (daySet.has(cur)) { streak++; cur = shiftDay(cur, -1); }
    let week = 0;
    for (let i = 0; i < 7; i++) if (daySet.has(shiftDay(t, -i))) week++;
    $("statWeek").textContent = week;
    $("statStreak").textContent = streak;
    $("statTotal").textContent = daySet.size;

    $("weekDots").innerHTML = [6,5,4,3,2,1,0].map(i => {
      const d = shiftDay(t, -i);
      const label = new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" });
      return `<div class="d"><div class="dot ${daySet.has(d) ? "done" : ""}">${daySet.has(d) ? "✓" : ""}</div>${label}</div>`;
    }).join("");

    // Personal bests: heaviest set (strength) or longest distance/time (everything else)
    const best = {};
    entries.forEach(e => {
      const key = e.exercise.toLowerCase();
      if (e.kind === "strength") {
        const w = heaviest(e);
        if (w != null && (!best[key] || w > best[key].v)) best[key] = { name: e.exercise, v: w, label: `${w} ${data.unit}` };
      } else if (e.distance != null || e.minutes != null) {
        const v = e.distance ?? e.minutes;
        if (!best[key] || v > best[key].v) best[key] = { name: e.exercise, v, label: e.distance != null ? `${e.distance} km` : `${e.minutes} min` };
      }
    });
    const pbs = Object.values(best).sort((a, b) => a.name.localeCompare(b.name));
    $("pbList").innerHTML = pbs.length
      ? pbs.map(p => `<div class="pb"><span>${escapeHtml(p.name)}</span><span class="val">${p.label}</span></div>`).join("")
      : `<div class="empty">Your records will show up here.</div>`;

    document.querySelectorAll(".unitLbl").forEach(el => el.textContent = data.unit);
    $("unit").value = data.unit;
    drawChart();
  }

  // ---------- Settings ----------
  $("unit").onchange = () => { data.unit = $("unit").value; save(); render(); };
  $("exportBtn").onclick = async () => {
    toast("Preparing backup…");
    const toDataUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
    const photos = {};
    for (const e of data.entries) for (const id of e.photos || []) {
      const blob = await getPhoto(id);
      if (blob) photos[id] = await toDataUrl(blob);
    }
    const blob = new Blob([JSON.stringify({ ...data, photos }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `workouts-backup-${todayStr()}.json`; a.click();
  };

  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800);
  }

  $("date").value = todayStr();
  resetSets();
  setKind("strength");
  render();

  // Keep a copy of the app on the phone so it opens without internet
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
